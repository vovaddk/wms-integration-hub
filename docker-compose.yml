# Local stack: SQL Server 2022 + API + worker. Dev-only password; override with MSSQL_SA_PASSWORD.
x-db: &db
  ConnectionStrings__WmsIntegrationHub: "Server=mssql,1433;Database=WmsIntegrationHub;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dev_Passw0rd!};TrustServerCertificate=True"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Dev_Passw0rd!}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      args:
        PROJECT: IntegrationHub.Api
    environment:
      <<: *db
      ASPNETCORE_URLS: "http://+:8080"
      FakeSubscriber__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      mssql:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        PROJECT: IntegrationHub.Worker
    environment:
      <<: *db
      FileDrop__Path: /data/filedrop
      Outbox__Subscribers__0__Url: "http://api:8080/fake-subscriber/wms-ui"
      Outbox__Subscribers__1__Url: "http://api:8080/fake-subscriber/erp"
    volumes:
      - ./filedrop:/data/filedrop
    depends_on:
      - api  # the API runs the migrations; until they finish the worker logs errors and keeps polling